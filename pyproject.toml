# Defines package metadata, dependencies, and development tool settings.
[project]
name = "yoink-backend"
version = "0.1.0"
description = "Backend services for Yoink."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3[crt]>=1.44.3",
    "fastapi>=0.162.7",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
yoink-backend = "yoink_backend.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.3",
    "httpx>=0.28.1",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers --cov=yoink_backend --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["yoink_backend"]

[tool.coverage.report]
exclude_also = ['if __name__ == .__main__.:']
