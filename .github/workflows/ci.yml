# Validates backend code, tests, packaging, and the Docker runtime on GitHub.
name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use GitHub-provisioned stable interpreters instead of uv's bundled download catalog.
env:
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON_PREFERENCE: only-system

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up stable Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          check-latest: true
          allow-prereleases: false
      - name: Verify stable interpreter
        run: python -c "import sys; print(sys.version); assert sys.version_info.releaselevel == 'final'"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.21"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .

  checks:
    name: Type checks and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up stable Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          allow-prereleases: false
      - name: Verify stable interpreter
        run: python -c "import sys; print(sys.version); assert sys.version_info.releaselevel == 'final'"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.21"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Type check
        run: uv run --locked mypy
      - name: Test with coverage
        run: uv run --locked pytest

  build:
    name: Python package build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up stable Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          allow-prereleases: false
      - name: Verify stable interpreter
        run: python -c "import sys; print(sys.version); assert sys.version_info.releaselevel == 'final'"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.21"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        env:
          DATABASE_DEV_URL: postgresql://postgres/ci
          DATABASE_DEV_ADMIN_URL: postgresql://postgres/ci
        run: |
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          export POSTGRES_PASSWORD
          cp .env.example .env
          docker compose config --quiet
      - name: Build image
        run: docker build --tag yoink-backend:ci .
      - name: Verify startup fails without S3 configuration
        run: |
          docker run --detach --name backend-ci yoink-backend:ci
          exit_code=$(timeout 30s docker wait backend-ci)
          test "$exit_code" -ne 0
          docker logs backend-ci 2>&1 | grep -F 'Application startup failed'
      - name: Show server logs and clean up
        if: always()
        run: |
          docker logs backend-ci || true
          docker rm --force backend-ci || true
