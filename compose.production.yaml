# Runs the production API and migrations against external Amazon RDS PostgreSQL.
services:
  backend:
    build: .
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      CLOUDWATCH_REGION: ${CLOUDWATCH_REGION:-}
      S3_PROD_BUCKET: ${S3_PROD_BUCKET:-}
      S3_PROD_REGION: ${S3_PROD_REGION:-}
      S3_PROD_PREFIX: ${S3_PROD_PREFIX:-videos}
      CLOUDWATCH_ENABLED: ${CLOUDWATCH_ENABLED:-false}
      CLOUDWATCH_LOG_GROUP_PREFIX: ${CLOUDWATCH_LOG_GROUP_PREFIX:-/yoink}
      APP_ENV: production
      DATABASE_PROD_URL: ${DATABASE_PROD_URL:?Set DATABASE_PROD_URL to the RDS runtime connection}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /app/certs/global-bundle.pem
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "127.0.0.1:8000:8000"
    init: true
  migrate:
    build: .
    profiles: [migration]
    command: [alembic, upgrade, head]
    environment:
      APP_ENV: production
      DATABASE_PROD_URL: ${DATABASE_PROD_URL:?Set DATABASE_PROD_URL to the RDS runtime connection}
      DATABASE_PROD_ADMIN_URL: ${DATABASE_PROD_ADMIN_URL:?Set DATABASE_PROD_ADMIN_URL to the RDS migration connection}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /app/certs/global-bundle.pem
    volumes:
      - ./certs:/app/certs:ro
    healthcheck:
      disable: true
