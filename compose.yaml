# Builds and exposes the backend API on the local machine.
services:
  backend:
    build: .
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      CLOUDWATCH_REGION: ${CLOUDWATCH_REGION:-}
      S3_DEV_BUCKET: ${S3_DEV_BUCKET:-}
      S3_DEV_REGION: ${S3_DEV_REGION:-}
      S3_DEV_PREFIX: ${S3_DEV_PREFIX:-videos}
      CLOUDWATCH_ENABLED: ${CLOUDWATCH_ENABLED:-false}
      CLOUDWATCH_LOG_GROUP_PREFIX: ${CLOUDWATCH_LOG_GROUP_PREFIX:-/yoink}
      APP_ENV: development
      DATABASE_DEV_URL: ${DATABASE_DEV_URL:?Set DATABASE_DEV_URL in your ignored env file}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    init: true
  migrate:
    build: .
    profiles: [migration]
    command: [alembic, upgrade, head]
    environment:
      APP_ENV: development
      DATABASE_DEV_URL: ${DATABASE_DEV_URL:?Set DATABASE_DEV_URL in your ignored env file}
      DATABASE_DEV_ADMIN_URL: ${DATABASE_DEV_ADMIN_URL:?Set DATABASE_DEV_ADMIN_URL in your ignored env file}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: yoink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored env file}
      POSTGRES_DB: yoink_development
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoink -d yoink_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
